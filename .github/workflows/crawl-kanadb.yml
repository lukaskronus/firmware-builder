name: Crawl KanaDB Cards

on:
  workflow_dispatch:
    inputs:
      delay:
        description: 'Delay between requests in seconds (to avoid IP bans)'
        required: true
        default: '0.5'

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Scraper
      run: python scripts/kana_scraper.py ${{ github.event.inputs.delay }}

    - name: Compress Artifacts (Speeds up upload)
      run: |
        zip -r kanadb_json_data.zip kana_db_data/ || true
        zip -r kanadb_card_images.zip kana_db_images/ || true

    - name: Upload JSON Data
      uses: actions/upload-artifact@v7
      with:
        name: kanadb-json-data
        path: kanadb_json_data.zip

    - name: Upload Card Images
      uses: actions/upload-artifact@v7
      with:
        name: kanadb-card-images
        path: kanadb_card_images.zip
