name: Crawl KanaDB Cards

concurrency:
  group: kanadb-crawl
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      delay:
        description: 'Minimum seconds between requests (be polite: 0.5+)'
        required: true
        default: '0.5'
      workers:
        description: 'Parallel workers (keep 1–3 to be polite)'
        required: true
        default: '3'
      force:
        description: 'Re-download everything, ignoring cached state'
        type: boolean
        default: false
      dry_run:
        description: 'Discover only, do not download'
        type: boolean
        default: false
      skip_images:
        description: 'Skip downloading card images (saves server bandwidth)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.31.0 beautifulsoup4==4.12.3

      - name: Restore crawl state
        uses: actions/cache@v6
        with:
          path: kana_db_state.json
          key: kanadb-state-v1
          restore-keys: |
            kanadb-state-v1

      - name: Run crawler
        run: |
          ARGS=""
          ARGS="$ARGS --delay ${{ github.event.inputs.delay }}"
          ARGS="$ARGS --workers ${{ github.event.inputs.workers }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.skip_images }}" = "true" ]; then ARGS="$ARGS --skip-images"; fi
          
          echo "Running: python kana_scraper.py $ARGS"
          python kana_scraper.py $ARGS

      - name: Ensure output directories exist
        if: always()
        run: |
          mkdir -p kana_db_data kana_db_images
          echo "JSON files:  $(ls kana_db_data  | wc -l)"
          echo "Image files: $(ls kana_db_images | wc -l)"

      - name: Upload JSON data (includes merged all_cards.json)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kanadb-json-data
          path: kana_db_data/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload card images
        # Only upload images if we actually downloaded them
        if: always() && github.event.inputs.skip_images != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kanadb-card-images
          path: kana_db_images/
          if-no-files-found: warn
          retention-days: 7

      - name: Save crawl state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: kana_db_state.json
          key: kanadb-state-${{ github.run_id }}