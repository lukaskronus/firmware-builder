name: Crawl KanaDB Cards (Async)

concurrency:
  group: kanadb-crawl-async
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to crawl: official, uncollectable, or both'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - official
          - uncollectable
      delay:
        description: 'Minimum seconds between requests (be polite: 0.2+ for async)'
        required: true
        default: '0.3'
      force:
        description: 'Re-download everything, ignoring cached state'
        type: boolean
        default: false
      dry_run:
        description: 'Discover only, do not download'
        type: boolean
        default: false
      skip_images:
        description: 'Skip downloading card images (saves server bandwidth)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # Increased timeout for full enhancement chain scraping

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp==3.9.5 beautifulsoup4==4.12.3

      # Cache the output files and state
      - name: Restore crawl state and data
        uses: actions/cache@v6
        with:
          path: |
            kana_db_data/
            all_cards_official.json
            all_cards_uncollectable.json
          key: kanadb-async-${{ github.run_id }}
          restore-keys: |
            kanadb-async-

      - name: Run crawler (Official)
        if: github.event.inputs.mode == 'both' || github.event.inputs.mode == 'official'
        run: |
          set -euo pipefail
          echo "Running Official Crawler..."
          # Note: Update your Python script to accept CLI args or modify the script's 
          # INCLUDE_UNCOLLECTABLE = False line directly if needed.
          # For this example, we assume you pass args or modify the script.
          # If using the script provided earlier, you might need to pass args like:
          python scripts/kana_scraper_async.py --mode official --delay ${{ github.event.inputs.delay }}
          
      - name: Run crawler (Uncollectable)
        if: github.event.inputs.mode == 'both' || github.event.inputs.mode == 'uncollectable'
        run: |
          set -euo pipefail
          echo "Running Uncollectable Crawler..."
          python scripts/kana_scraper_async.py --mode uncollectable --delay ${{ github.event.inputs.delay }}

      - name: Ensure output directories exist
        if: always()
        run: |
          mkdir -p kana_db_data
          echo "Total JSON files: $(ls kana_db_data/*.json 2>/dev/null | wc -l)"

      - name: Upload Official JSON
        if: always() && (github.event.inputs.mode == 'both' || github.event.inputs.mode == 'official')
        uses: actions/upload-artifact@v7
        with:
          name: kanadb-official-json-async
          path: all_cards_official.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Uncollectable JSON
        if: always() && (github.event.inputs.mode == 'both' || github.event.inputs.mode == 'uncollectable')
        uses: actions/upload-artifact@v7
        with:
          name: kanadb-uncollectable-json-async
          path: all_cards_uncollectable.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Individual Card Data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kanadb-individual-cards
          path: kana_db_data/
          if-no-files-found: warn
          retention-days: 7
