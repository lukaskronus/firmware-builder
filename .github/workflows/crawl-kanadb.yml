name: Crawl KanaDB Cards

concurrency:
  group: kanadb-crawl
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to crawl: official, uncollectable, or both'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - official
          - uncollectable
      delay:
        description: 'Minimum seconds between requests (be polite: 0.5+)'
        required: true
        default: '0.5'
      workers:
        description: 'Parallel workers (keep 1–3 to be polite)'
        required: true
        default: '3'
      force:
        description: 'Re-download everything, ignoring cached state'
        type: boolean
        default: false
      dry_run:
        description: 'Discover only, do not download'
        type: boolean
        default: false
      skip_images:
        description: 'Skip downloading card images (saves server bandwidth)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.34.2 beautifulsoup4==4.15.0

      # Cache the OUTPUT too, not just the state file.
      # Unique key per run + prefix restore = always saves fresh, restores latest.
      - name: Restore crawl state and data
        uses: actions/cache@v6
        with:
          path: |
            kana_db_state.json
            kana_db_state_uncollectable.json
            kana_db_data/
            kana_db_data_uncollectable/
            kana_db_images/
            faction_report.json
            faction_report_uncollectable.json
          key: kanadb-full-${{ github.run_id }}
          restore-keys: |
            kanadb-full-

      - name: Run crawler
        run: |
          set -euo pipefail
          ARGS=""
          ARGS="$ARGS --delay ${{ github.event.inputs.delay }}"
          ARGS="$ARGS --workers ${{ github.event.inputs.workers }}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.skip_images }}" = "true" ]; then ARGS="$ARGS --skip-images"; fi
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "both" ] || [ "$MODE" = "official" ]; then
            echo "Running official: python scripts/kana_scraper.py $ARGS"
            python scripts/kana_scraper.py $ARGS
          fi
          if [ "$MODE" = "both" ] || [ "$MODE" = "uncollectable" ]; then
            echo "Running uncollectable: python scripts/kana_scraper.py $ARGS --include-uncollectable"
            python scripts/kana_scraper.py $ARGS --include-uncollectable
          fi

      - name: Ensure output directories exist
        if: always()
        run: |
          mkdir -p kana_db_data kana_db_data_uncollectable kana_db_images
          echo "Official JSON files:      $(ls kana_db_data 2>/dev/null | wc -l)"
          echo "Uncollectable JSON files: $(ls kana_db_data_uncollectable 2>/dev/null | wc -l)"
          echo "Image files:              $(ls kana_db_images 2>/dev/null | wc -l)"

      - name: Upload official JSON data
        if: always() && (github.event.inputs.mode == 'both' || github.event.inputs.mode == 'official')
        uses: actions/upload-artifact@v7
        with:
          name: kanadb-official-json
          path: kana_db_data/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload uncollectable JSON data
        if: always() && (github.event.inputs.mode == 'both' || github.event.inputs.mode == 'uncollectable')
        uses: actions/upload-artifact@v7
        with:
          name: kanadb-uncollectable-json
          path: kana_db_data_uncollectable/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload faction reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kanadb-faction-reports
          path: |
            faction_report.json
            faction_report_uncollectable.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload card images
        if: always() && github.event.inputs.skip_images != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: kanadb-card-images
          path: kana_db_images/
          if-no-files-found: warn
          retention-days: 7
